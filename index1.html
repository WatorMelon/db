<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运维与数据库 刷题练习</title>
<style>
:root{
  --bg:#121417; --panel:#1c1f24; --panel2:#24282f; --line:#333842;
  --text:#e8eaed; --sub:#9aa0a8; --accent:#4c8dff; --green:#2ecc71; --red:#e74c3c;
  --amber:#f5b942; --radius:12px; --shadow:0 4px 16px rgba(0,0,0,.3);
}
[data-mode="light"]{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef1f5; --line:#e1e5ea;
  --text:#1d2126; --sub:#6b7280; --shadow:0 4px 16px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Noto Sans SC","Segoe UI",Roboto,sans-serif;line-height:1.6;padding-bottom:60px;transition:background .2s,color .2s}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px}

header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px}
header h1{font-size:18px;font-weight:700}
header .cnt{color:var(--sub);font-size:12px}
/* 设置按钮 */
.setting{position:relative}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--sub);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--text);border-color:var(--accent)}
.menu{position:absolute;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:150px;z-index:50;display:none}
.menu.open{display:block}
.menu .m-title{font-size:11px;color:var(--sub);padding:6px 10px 4px}
.menu .m-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text)}
.menu .m-item:hover{background:var(--panel2)}
.menu .m-item.on{color:var(--accent)}
.menu .m-item .dot{font-size:12px}

.stats{display:flex;gap:16px;margin:10px 2px;font-size:13px;color:var(--sub)}
.stats b{color:var(--text);font-size:15px}
.stats .ok b{color:var(--green)} .stats .bad b{color:var(--red)} .stats .rate b{color:var(--amber)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tab{padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--sub);font-size:12px;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

.modes{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.mode{padding:6px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--sub);font-size:12px;cursor:pointer}
.mode.active{color:var(--text);border-color:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:12px}
.q-meta{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-bottom:10px}
.q-cat{color:var(--accent)}
.stem{font-size:16px;font-weight:600;margin-bottom:14px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);cursor:pointer;transition:.12s;text-align:left;color:var(--text);width:100%;font-size:14px}
.opt .tag{flex:0 0 24px;height:24px;border-radius:7px;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.correct{border-color:var(--green);background:rgba(46,204,113,.12)}
.opt.correct .tag{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:rgba(231,76,60,.12)}
.opt.wrong .tag{background:var(--red);color:#fff}
.opt:disabled{cursor:default}

.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--panel2);font-size:13px;color:var(--sub);display:none;border-left:3px solid var(--line)}
.explain.show{display:block}
.explain.good{border-left-color:var(--green)}
.explain.bad{border-left-color:var(--red)}
.explain .ans{font-weight:700;color:var(--text);margin-bottom:4px}
.explain.bad .ans{color:var(--red)}
.explain.good .ans{color:var(--green)}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{padding:10px 18px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

details{margin-top:16px}
summary{cursor:pointer;color:var(--sub);font-size:13px;padding:8px 2px;user-select:none}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.gcell{aspect-ratio:1;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);cursor:pointer}
.gcell.cur{border-color:var(--accent);color:var(--accent)}
.gcell.right{background:rgba(46,204,113,.18);color:var(--green);border-color:var(--green)}
.gcell.wrong{background:rgba(231,76,60,.18);color:var(--red);border-color:var(--red)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.reset{font-size:12px;color:var(--sub);background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
@media(max-width:560px){
  .grid{grid-template-columns:repeat(5,1fr)}
  .stem{font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>运维与数据库 · 刷题</h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="cnt">共 <span id="total"></span> 题</span>
      <div class="setting">
        <button class="icon-btn" id="setBtn" title="设置">⚙</button>
        <div class="menu" id="themeMenu">
          <div class="m-title">主题</div>
          <div class="m-item" data-theme="auto"><span>跟随系统</span><span class="dot"></span></div>
          <div class="m-item" data-theme="dark"><span>深色</span><span class="dot"></span></div>
          <div class="m-item" data-theme="light"><span>浅色</span><span class="dot"></span></div>
        </div>
      </div>
    </div>
  </header>

  <div class="stats">
    <span>已答 <b id="stAnswered">0</b></span>
    <span class="ok">对 <b id="stRight">0</b></span>
    <span class="bad">错 <b id="stWrong">0</b></span>
<span class="rate">正确率 <b id="stRate">-</b></span>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="modes">
    <button class="mode active" data-mode="order">顺序</button>
    <button class="mode" data-mode="random">乱序</button>
    <button class="mode" data-mode="wrong">错题重练</button>
  </div>

  <div id="quiz"></div>

  <details id="gridBox">
    <summary>题号导航</summary>
    <div class="grid" id="grid"></div>
  </details>

  <details>
    <summary>更多操作</summary>
    <div class="toolbar">
      <button class="reset" id="resetAll">清空全部进度</button>
      <button class="reset" id="resetWrong">清出错题本</button>
    </div>
  </details>
</div>

const state = {

  wrong: {},
  theme: 'auto'
};

const mq = window.matchMedia('(prefers-color-scheme: light)');

function load(){
  try{
    const s = JSON.parse(localStorage.getItem('quiz_v3') || '{}');
    if(s.answers) state.answers = s.answers;
    if(s.wrong) state.wrong = s.wrong;
    if(s.theme) state.theme = s.theme;
    if(Array.isArray(s.cats)) state.cats = s.cats;
  }catch(e){}
}
function save(){
  localStorage.setItem('quiz_v3', JSON.stringify({answers: state.answers, wrong: state.wrong, theme: state.theme, cats: state.cats}));
}

function applyTheme(){
  let mode = state.theme;
  if(mode === 'auto') mode = mq.matches ? 'light' : 'dark';
document.body.dataset.mode = mode;
  document.querySelectorAll('.m-item').forEach(it => {
    const on = it.dataset.theme === state.theme;
    it.classList.toggle('on', on);
    it.querySelector('.dot').textContent = on ? '✓' : '';
  });
}

function buildOrder(){
  let list = QUESTIONS;
  if(state.cats.length) list = list.filter(q => state.cats.includes(q.catIdx));

  let ids = list.map(q => q.id);
  if(state.mode === 'random') ids = ids.sort(() => Math.random() - 0.5);
  state.order = ids;
  state.cur = 0;
}

function currentQ(){
  return QUESTIONS.find(q => q.id === state.order[state.cur]);
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  const allActive = state.cats.length === 0;
  const all = document.createElement('button');
  all.className = 'tab' + (allActive?' active':'');
  all.textContent = '全部(' + QUESTIONS.length + ')';
  all.onclick = () => { state.cats = []; save(); refresh(); };
tabs.appendChild(all);
  DATA.forEach((cat,i) => {
    const on = state.cats.includes(i);
    const b = document.createElement('button');
    b.className = 'tab' + (on?' active':'');
    b.textContent = cat.category.split(' ')[0] + '(' + cat.questions.length + ')';
    b.onclick = () => {
      if(on) state.cats = state.cats.filter(x=>x!==i);
      else state.cats.push(i);
      save(); refresh();
    };
    tabs.appendChild(b);
  });
}

function renderStats(){
  const answered = Object.keys(state.answers).length;
  const right = Object.values(state.answers).filter(a=>a.right).length;
  const wrong = answered - right;
  document.getElementById('stAnswered').textContent = answered;
  document.getElementById('stRight').textContent = right;
  document.getElementById('stWrong').textContent = wrong;
  document.getElementById('stRate').textContent = answered ? Math.round(right/answered*100)+'%' : '-';
}

function renderQuestion(){
  const box = document.getElementById('quiz');
  const q = currentQ();
if(!q){
    box.innerHTML = '<div class="empty">当前选择下没有题目，换个分类刷一刷吧。</div>';
    return;
  }
  const ans = state.answers[q.id];
  const opts = ['A','B','C','D'].map(k => {
    let cls = 'opt', disabled = '';
    if(ans){
      disabled = 'disabled';
      if(k === q.answer) cls += ' correct';
      else if(k === ans.picked) cls += ' wrong';
    }
    return `<button class="${cls}" data-k="${k}" ${disabled}>
      <span class="tag">${k}</span><span>${escapeHtml(q.options[k])}</span>
    </button>`;
  }).join('');

  let explainHtml = '';
  if(ans){
    const cls = ans.right ? 'good' : 'bad';
    const head = ans.right ? '✅ 回答正确' : '❌ 回答错误，正确答案：' + q.answer;
    explainHtml = `<div class="explain show ${cls}">
      <div class="ans">${head}</div>
      <div>${escapeHtml(q.explain)}</div>
    </div>`;
  }

  box.innerHTML = `
    <div class="card">
      <div class="q-meta">
        <span class="q-cat">${q.cat}</span>
        <span>${state.cur+1}/${state.order.length} · 原题 ${q.num}</span>
</div>
      <div class="stem">${escapeHtml(q.stem)}</div>
      <div class="opts">${opts}</div>
      ${explainHtml}
      <div class="nav">
        <button class="btn" id="prev" ${state.cur===0?'disabled':''}>← 上一题</button>
        <button class="btn primary" id="next" ${state.cur>=state.order.length-1?'disabled':''}>下一题 →</button>
      </div>
    </div>`;

  box.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => pick(q, btn.dataset.k);
  });
  document.getElementById('prev').onclick = () => { state.cur--; render(); };
  document.getElementById('next').onclick = () => { state.cur++; render(); };
}

function pick(q, k){
  if(state.answers[q.id]) return;
  const right = k === q.answer;
  state.answers[q.id] = { picked: k, right };
  if(!right) state.wrong[q.id] = true;
  else delete state.wrong[q.id];
  save();
  render();
}

function renderGrid(){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  state.order.forEach((id, i) => {
    const q = QUESTIONS.find(x=>x.id===id);
const ans = state.answers[id];
    let cls = 'gcell';
    if(i===state.cur) cls += ' cur';
    if(ans) cls += ans.right ? ' right' : ' wrong';
    const cell = document.createElement('div');
    cell.className = cls;
    cell.textContent = q.num;
    cell.onclick = () => { state.cur = i; render(); document.getElementById('gridBox').open = true; };
    g.appendChild(cell);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  renderTabs();
  renderStats();
  renderQuestion();
  renderGrid();
}
function refresh(){ buildOrder(); render(); }

// 模式切换
document.querySelectorAll('.mode').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.mode = b.dataset.mode;
    refresh();
  };
});

// 主题菜单
const setBtn = document.getElementById('setBtn');
const themeMenu = document.getElementById('themeMenu');
setBtn.onclick = (e) => { e.stopPropagation(); themeMenu.classList.toggle('open'); };
document.addEventListener('click', (e) => {
  if(!themeMenu.contains(e.target)) themeMenu.classList.remove('open');
});
document.querySelectorAll('.m-item').forEach(it => {
  it.onclick = () => {
    state.theme = it.dataset.theme;
    save(); applyTheme(); themeMenu.classList.remove('open');
  };
});
mq.addEventListener('change', applyTheme);

document.getElementById('resetAll').onclick = () => {
  if(confirm('确定清空所有答题进度和错题本？')){
    state.answers = {}; state.wrong = {}; save(); refresh();
  }
};
document.getElementById('resetWrong').onclick = () => {
  state.wrong = {}; save(); refresh();
};

document.getElementById('total').textContent = QUESTIONS.length;
load();
applyTheme();
refresh();
</script>
</body>
</html>
